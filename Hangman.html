<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg:#f5f3ff;--card:#fff;--text:#1e1b4b;--muted:#6b7280;--accent:#6d28d9;--good:#16a34a;--bad:#dc2626;--key:#ede9fe;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b1f;--card:#1b1633;--text:#ede9fe;--muted:#a1a1aa;--accent:#a78bfa;--good:#4ade80;--bad:#f87171;--key:#2b2350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0b1f;--card:#1b1633;--text:#ede9fe;--muted:#a1a1aa;--accent:#a78bfa;--good:#4ade80;--bad:#f87171;--key:#2b2350;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
.card{background:var(--card);width:100%;max-width:520px;margin:16px;padding:22px;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.12);text-align:center;height:fit-content}
h1{margin:0 0 6px}h2{margin:18px 0 6px;font-size:1.05rem}
.muted{color:var(--muted)}
input{font-size:1.1rem;padding:12px 14px;border-radius:10px;border:2px solid var(--accent);width:100%;max-width:300px;background:var(--bg);color:var(--text);text-align:center}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.primary{background:var(--accent);color:#fff;padding:12px 22px;margin:14px 4px 0;font-weight:600}
.ghost{background:var(--key);color:var(--text);padding:10px 16px;margin:14px 4px 0}
.hidden{display:none}
.bar{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:6px}
svg{width:190px;height:200px}
svg .part{stroke:var(--text);stroke-width:4;stroke-linecap:round;fill:none;display:none}
svg .gal{stroke:var(--muted);stroke-width:5;stroke-linecap:round;fill:none}
#word{font-size:2rem;letter-spacing:.4em;font-weight:700;margin:6px 0 4px;min-height:2.6rem;word-break:break-all}
#msg{min-height:3.4rem;font-size:1.15rem;font-weight:600}
#msg .big{font-size:2.4rem;display:block}
.win{color:var(--good)}.lose{color:var(--bad)}
#keys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:10px}
#keys button{background:var(--key);color:var(--text);padding:9px 0;font-weight:600}
#keys button:disabled{opacity:.35;cursor:default}
#keys button.hit{background:var(--good);color:#fff;opacity:1}
#keys button.miss{background:var(--bad);color:#fff;opacity:1}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;text-align:left}
th,td{padding:7px 8px;border-bottom:1px solid var(--key)}
th{color:var(--muted);font-weight:600}
.credit{font-family:"Dancing Script","Brush Script MT","Segoe Script","Lucida Handwriting",cursive;font-size:1.6rem;color:var(--accent);margin-top:18px}
.rm{background:var(--bad);color:#fff;padding:4px 10px;font-size:.8rem}
</style>
</head>
<body>
<div class="card">
  <!-- START SCREEN -->
  <div id="start">
    <h1>🎮 Hangman</h1>
    <p class="muted">You have 6 lives for the whole game. Solve as many words as you can!</p>
    <p><input id="name" maxlength="16" placeholder="Enter your name" autocomplete="off"></p>
    <div id="err" class="lose"></div>
    <button class="primary" id="go">Start Game</button>
    <div class="credit">Made by Soumodip Mallick</div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game" class="hidden">
    <div class="bar"><span id="who"></span><span id="score"></span></div>
    <svg viewBox="0 0 190 200" aria-label="Hangman drawing">
      <path class="gal" d="M20 190H110M50 190V15H140V40"/>
      <circle class="part" cx="140" cy="58" r="18"/>
      <path class="part" d="M140 76V130"/>
      <path class="part" d="M140 90L116 112"/>
      <path class="part" d="M140 90L164 112"/>
      <path class="part" d="M140 130L120 168"/>
      <path class="part" d="M140 130L160 168"/>
    </svg>
    <div id="lives"></div>
    <div id="word"></div>
    <div id="hint" class="muted"></div>
    <div id="msg"></div>
    <div id="keys"></div>
    <div id="endbtns" class="hidden">
      <button class="primary" id="again">Try Again</button>
      <button class="ghost" id="change">Change Player</button>
    </div>
  </div>

  <!-- PLAYERS / SCORES (always visible) -->
  <h2>🏆 Leaderboard</h2>
  <div id="rank" class="muted" style="font-size:.9rem"></div>
  <div class="tablewrap" id="board"></div>
  <div class="muted" id="status" style="font-size:.8rem;margin-top:8px"></div>
  <button class="ghost" id="adminBtn">🔒 Admin</button>
  <button class="ghost hidden" id="clear">Clear all</button>
  <div class="credit">Made by Soumodip Mallick</div>
</div>

<script>
const WORDS = {
  Animal: ["elephant","giraffe","dolphin","penguin","kangaroo","cheetah","octopus","tiger"],
  Fruit: ["banana","mango","orange","papaya","pineapple","guava","cherry","lychee"],
  Tech: ["python","keyboard","internet","browser","compiler","database","variable","algorithm"],
  Country: ["india","brazil","canada","germany","japan","egypt","australia","nepal"],
  School: ["library","teacher","notebook","science","homework","student","geometry","playground"]
};
const MAX = 6, KEY = "hangman:players";
const LOSER = ["😭","🤡","😵","🙈","💀","😂"];
let player = "", word = "", cat = "", guessed = new Set(), lives = MAX, solved = 0, over = false;
let pool = [], memory = [];

const $ = id => document.getElementById(id);
const parts = document.querySelectorAll("svg .part");

/* ---------- leaderboard (saved on this device; admin can manage) ---------- */
const ADMIN_PIN = "1234";   // <-- change this to your own secret PIN
let admin = false, localRows = [];
function loadLocal() {
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : localRows; } catch (e) { return localRows; }
}
function saveLocal(list) { localRows = list; try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
const keyOf = n => (n.toLowerCase().replace(/[^a-z0-9]/g, "_").slice(0, 30)) || "player";

function addResult() {
  const l = loadLocal(), k = keyOf(player);
  let row = l.find(r => r.key === k);
  if (!row) { row = { key: k, name: player, best: 0, plays: 0 }; l.push(row); }
  row.name = player; row.best = Math.max(row.best, solved); row.plays++;
  saveLocal(l);
  showBoard();
}

function showBoard() {
  const all = loadLocal().slice().sort((a, b) => b.best - a.best || a.plays - b.plays);
  const list = admin ? all : all.slice(0, 10);
  $("rank").textContent = all.length + " player" + (all.length === 1 ? "" : "s") + " competing" + (admin ? " · admin view" : "");
  if (!list.length) { $("board").innerHTML = '<p class="muted">No players yet. Be the first!</p>'; return; }
  let h = "<table><tr><th>#</th><th>Name</th><th>Best</th><th>Games</th>" + (admin ? "<th></th>" : "") + "</tr>";
  list.forEach((p, i) => {
    const medal = ["🥇","🥈","🥉"][i] || (i + 1);
    const me = player && p.name.toLowerCase() === player.toLowerCase();
    h += "<tr" + (me ? ' style="font-weight:700"' : "") + "><td>" + medal + "</td><td>" + esc(p.name) + (me ? " (you)" : "") +
         "</td><td>" + p.best + "</td><td>" + p.plays + "</td>" +
         (admin ? '<td><button class="rm" data-k="' + esc(p.key) + '">Remove</button></td>' : "") + "</tr>";
  });
  $("board").innerHTML = h + "</table>";
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function setAdmin(on) {
  admin = on;
  $("adminBtn").textContent = on ? "🔓 Lock admin" : "🔒 Admin";
  $("clear").classList.toggle("hidden", !on);
  $("status").textContent = on ? "Admin mode: you can remove any player from the leaderboard." : "Scores are saved on this device. Play on the same browser so everyone appears here.";
  showBoard();
}

/* ---------- game flow ---------- */
function begin() {
  const n = $("name").value.trim();
  if (!n) { $("err").textContent = "Please enter your name first!"; $("name").focus(); return; }
  player = n;
  $("start").classList.add("hidden");
  $("game").classList.remove("hidden");
  startRun();
}

function startRun() {            // a new run: full lives, score 0
  lives = MAX; solved = 0; over = false;
  parts.forEach(p => p.style.display = "none");
  $("endbtns").classList.add("hidden");
  pool = [];
  nextWord();
}

function nextWord() {
  if (!pool.length) {
    for (const c in WORDS) WORDS[c].forEach(w => pool.push({ c, w }));
    pool.sort(() => Math.random() - 0.5);
  }
  const pick = pool.pop();
  cat = pick.c; word = pick.w;
  guessed = new Set();
  $("hint").textContent = "Category: " + cat + " (" + word.length + " letters)";
  const k = $("keys"); k.innerHTML = "";
  for (const ch of "abcdefghijklmnopqrstuvwxyz") {
    const b = document.createElement("button");
    b.textContent = ch.toUpperCase(); b.id = "k" + ch;
    b.onclick = () => guess(ch);
    k.appendChild(b);
  }
  render();
}

function render() {
  $("who").textContent = "👤 " + player;
  $("score").textContent = "✅ Solved: " + solved;
  $("lives").textContent = "Lives: " + "❤️".repeat(lives) + "🖤".repeat(MAX - lives);
  $("word").textContent = [...word].map(c => guessed.has(c) ? c.toUpperCase() : "_").join(" ");
}

let locked = false;
function guess(ch) {
  if (over || locked || guessed.has(ch)) return;
  guessed.add(ch);
  const btn = $("k" + ch);
  btn.disabled = true;
  if (word.includes(ch)) {
    btn.classList.add("hit");
    if ([...word].every(c => guessed.has(c))) wordSolved();
  } else {
    btn.classList.add("miss");
    if (parts[MAX - lives]) parts[MAX - lives].style.display = "block";
    lives--;
    const e = LOSER[Math.floor(Math.random() * LOSER.length)];
    $("msg").innerHTML = '<span class="big">' + e + '</span><span class="lose">Wrong guess! Try again</span>';
    const card = document.querySelector(".card");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    if (lives <= 0) gameOver();
  }
  render();
}

function wordSolved() {
  solved++;
  locked = true;
  $("msg").innerHTML = '<span class="big">🎉</span><span class="win">Correct! Next word coming…</span>';
  render();
  setTimeout(() => { locked = false; $("msg").innerHTML = ""; nextWord(); }, 1200);
}

function gameOver() {
  over = true;
  document.querySelectorAll("#keys button").forEach(b => b.disabled = true);
  $("word").textContent = [...word].map(c => c.toUpperCase()).join(" ");
  $("msg").innerHTML = '<span class="big">😭🤡</span><span class="lose">Game over, ' + esc(player) +
    '! You solved ' + solved + ' word' + (solved === 1 ? "" : "s") + '. The word was “' + word.toUpperCase() + '”. Try again!</span>';
  $("endbtns").classList.remove("hidden");
  addResult();
  render();
}

function changePlayer() {
  $("game").classList.add("hidden");
  $("start").classList.remove("hidden");
  $("name").value = ""; $("err").textContent = ""; $("name").focus();
}

$("go").onclick = begin;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") begin(); });
$("again").onclick = () => { $("msg").innerHTML = ""; startRun(); };
$("change").onclick = changePlayer;
$("clear").onclick = () => { if (admin && confirm("Remove ALL players from the leaderboard?")) { saveLocal([]); showBoard(); } };
$("adminBtn").onclick = () => {
  if (admin) { setAdmin(false); return; }
  const pin = prompt("Enter admin PIN:");
  if (pin === null) return;
  if (pin === ADMIN_PIN) setAdmin(true); else alert("Wrong PIN");
};
$("board").addEventListener("click", e => {
  const k = e.target && e.target.getAttribute && e.target.getAttribute("data-k");
  if (!admin || !k) return;
  if (confirm("Remove this player from the leaderboard?")) { saveLocal(loadLocal().filter(r => r.key !== k)); showBoard(); }
});
document.addEventListener("keydown", e => {
  if ($("game").classList.contains("hidden")) return;
  if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
  else if (e.key === "Enter" && over) { $("msg").innerHTML = ""; startRun(); }
});
setAdmin(false);
</script>
</body>
</html>
